<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiante | UNEMI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado-contenido">
      <div class="logo">
        <span class="logo-texto">UNEMI</span>
        <span class="logo-sub">Universidad Estatal de Milagro</span>
      </div>

      <span class="divisor" aria-hidden="true"></span>

      <svg class="icono-titulo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/><path d="M22 10v6"/>
      </svg>

      <div class="titulo">
        <h1>Registro de Estudiante</h1>
        <p>Completa todos los campos obligatorios (*)</p>
      </div>

      <p class="eslogan">Tu futuro<br><span>comienza aquí</span></p>
    </div>
  </header>

  <main class="tarjeta">
    <form id="formRegistro" class="formulario" novalidate>

      <div class="campo">
        <label for="nombre">Nombre completo <span class="obligatorio">*</span></label>
        <div class="control">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z"/></svg>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez"
                 required minlength="3" maxlength="60" autocomplete="name">
        </div>
        <small class="mensaje"></small>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico <span class="obligatorio">*</span></label>
        <div class="control">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" id="correo" name="correo" placeholder="usuario@unemi.edu.ec"
                 required autocomplete="email">
        </div>
        <small class="mensaje"></small>
      </div>

      <div class="campo">
        <label for="password">Contraseña <span class="obligatorio">*</span></label>
        <div class="control input-grupo">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres"
                 required minlength="8" autocomplete="new-password">
          <button type="button" class="btn-ver" data-target="password" aria-label="Mostrar contraseña">
            <svg class="ojo" viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
            <svg class="ojo-cerrado" viewBox="0 0 24 24"><path d="M12 7a5 5 0 0 1 5 5c0 .65-.13 1.26-.36 1.83l2.92 2.92A11.8 11.8 0 0 0 23 12c-1.7-3.9-6-7-11-7-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.74 2.74A11.8 11.8 0 0 0 1 12c1.7 3.9 6 7 11 7 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 21 21 19.73 3.27 2 2 4.27zM7.53 9.8l1.55 1.55A3 3 0 0 0 9 12a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.55 1.55A5 5 0 0 1 7.53 9.8zm4.31-.78 3.15 3.15.02-.16a3 3 0 0 0-3-3l-.17.01z"/></svg>
          </button>
          <div class="fuerza"><div class="fuerza-barra" id="fuerzaBarra"></div></div>
        </div>
        <small class="mensaje"></small>
      </div>

      <div class="campo">
        <label for="confirmar">Confirmar contraseña <span class="obligatorio">*</span></label>
        <div class="control input-grupo">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
          <input type="password" id="confirmar" name="confirmar" placeholder="Repite la contraseña"
                 required minlength="8" autocomplete="new-password">
          <button type="button" class="btn-ver" data-target="confirmar" aria-label="Mostrar contraseña">
            <svg class="ojo" viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
            <svg class="ojo-cerrado" viewBox="0 0 24 24"><path d="M12 7a5 5 0 0 1 5 5c0 .65-.13 1.26-.36 1.83l2.92 2.92A11.8 11.8 0 0 0 23 12c-1.7-3.9-6-7-11-7-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.74 2.74A11.8 11.8 0 0 0 1 12c1.7 3.9 6 7 11 7 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 21 21 19.73 3.27 2 2 4.27zM7.53 9.8l1.55 1.55A3 3 0 0 0 9 12a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.55 1.55A5 5 0 0 1 7.53 9.8zm4.31-.78 3.15 3.15.02-.16a3 3 0 0 0-3-3l-.17.01z"/></svg>
          </button>
        </div>
        <small class="mensaje"></small>
      </div>

      <div class="campo">
        <label for="edad">Edad <span class="obligatorio">*</span></label>
        <div class="control">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11zM7 11h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2zm-8 4h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/></svg>
          <input type="number" id="edad" name="edad" placeholder="Entre 16 y 99"
                 required min="16" max="99" step="1">
        </div>
        <small class="mensaje"></small>
      </div>

      <div class="campo">
        <label for="telefono">Teléfono celular <span class="obligatorio">*</span></label>
        <div class="control">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1l-2.2 2.2z"/></svg>
          <input type="tel" id="telefono" name="telefono" placeholder="0991234567"
                 required pattern="09[0-9]{8}" maxlength="10" inputmode="numeric" autocomplete="tel">
        </div>
        <small class="mensaje"></small>
      </div>

      <div class="campo">
        <label for="carrera">Carrera <span class="obligatorio">*</span></label>
        <div class="control">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
          <select id="carrera" name="carrera" required>
            <option value="">-- Selecciona una carrera --</option>
            <option value="software">Ingeniería de Software</option>
            <option value="ti">Tecnologías de la Información</option>
            <option value="industrial">Ingeniería Industrial</option>
            <option value="administracion">Administración de Empresas</option>
            <option value="educacion">Educación</option>
          </select>
        </div>
        <small class="mensaje"></small>
      </div>

      <div class="campo">
        <label for="fecha">Fecha de nacimiento <span class="obligatorio">*</span></label>
        <div class="control">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11zM7 11h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2zm-8 4h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/></svg>
          <input type="date" id="fecha" name="fecha" required min="1927-01-01">
        </div>
        <small class="mensaje"></small>
      </div>

      <fieldset class="campo campo-completo">
        <legend>Modalidad de estudio <span class="obligatorio">*</span></legend>
        <div class="opciones">
          <label class="opcion"><input type="radio" name="modalidad" value="presencial" required> Presencial</label>
          <label class="opcion"><input type="radio" name="modalidad" value="en-linea"> En línea</label>
          <label class="opcion"><input type="radio" name="modalidad" value="hibrida"> Híbrida</label>
        </div>
        <small class="mensaje"></small>
      </fieldset>

      <div class="campo campo-completo">
        <label for="comentarios">Comentarios (opcional)</label>
        <div class="control control-area">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
          <textarea id="comentarios" name="comentarios" rows="3" maxlength="200"
                    placeholder="Escribe algo sobre ti..."></textarea>
        </div>
        <small class="contador"><span id="contador">0</span>/200</small>
      </div>

      <div class="campo campo-completo">
        <label class="check">
          <input type="checkbox" id="terminos" name="terminos" required>
          Acepto los términos y condiciones <span class="obligatorio">*</span>
        </label>
        <small class="mensaje"></small>
      </div>

      <div class="acciones campo-completo">
        <button type="reset" class="btn btn-secundario">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg>
          Limpiar
        </button>
        <button type="submit" class="btn btn-primario">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
          Registrar
        </button>
      </div>

      <div id="alerta" class="alerta campo-completo" role="alert" hidden></div>
    </form>
  </main>

  <footer class="pie">
    Universidad Estatal de Milagro &bull; Práctica: Formulario web 

  <script src="script.js"></script>
</body>
</html>
